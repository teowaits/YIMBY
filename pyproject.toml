[project]
name = "regional-scout"
version = "0.3.0"
description = "Identify and rank researchers in a geographic region for Wiley AI×science editorial scouting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "httpx>=0.27",
    "networkx>=3.2",
    "jinja2>=3.1",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
regional-scout = "regional_scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regional_scout"]

[tool.hatch.build.targets.wheel.force-include]
"regional_scout/templates" = "regional_scout/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
